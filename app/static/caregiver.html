<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlucoRelay Caregiver Alert</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color-scheme: dark;
        background: #101114;
        color: #f6f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        width: min(640px, 100%);
        margin: auto;
      }
      .card {
        background: #1a1c22;
        border: 1px solid #343844;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .status {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #ff9f6e;
      }
      .muted {
        color: #b6bbc8;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
        margin: 0;
      }
      dt {
        color: #8a8f9c;
      }
      dd {
        margin: 0;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
        background: #6fd6a2;
        color: #04180d;
        width: 100%;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      a {
        color: #7da2ff;
      }
      ul {
        padding-left: 18px;
        max-height: 260px;
        overflow: auto;
      }
      .warning {
        border-left: 4px solid #f2be55;
        padding-left: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GlucoRelay Caregiver Alert</h1>
      <p class="warning">
        Hackathon simulation only. Not a real emergency notification system.
      </p>

      <section class="card">
        <div id="status" class="status">Loading...</div>
        <p id="reason" class="muted"></p>
        <h2 id="handoffHeadline"></h2>
        <p id="handoffText"></p>
        <dl id="details"></dl>
        <p id="mapsLink"></p>
      </section>

      <section class="card">
        <button id="ackBtn" onclick="acknowledge()" disabled>
          I'm responding
        </button>
        <p id="ackMessage" class="muted"></p>
      </section>

      <section class="card">
        <h2>Incident timeline</h2>
        <ul id="timeline"></ul>
      </section>
    </main>

    <script>
      const publicToken = window.location.pathname.split("/").pop();

      async function loadEvent() {
        const response = await fetch(`/api/caregiver/events/${publicToken}`);
        if (!response.ok) {
          document.getElementById("status").textContent = "Not found";
          document.getElementById("reason").textContent =
            "This caregiver link is invalid or has expired.";
          document.getElementById("ackBtn").disabled = true;
          return null;
        }
        return response.json();
      }

      function render(event) {
        document.getElementById("status").textContent = event.status;
        document.getElementById("reason").textContent = event.reason;
        document.getElementById("handoffHeadline").textContent =
          event.caregiver_handoff_headline || "";
        document.getElementById("handoffText").textContent =
          event.caregiver_handoff || "";

        const details = document.getElementById("details");
        details.innerHTML = "";
        const rows = [
          ["Reading", `${event.latest_reading.value_mg_dl} mg/dL (${event.latest_reading.trend})`],
          ["Patient response", event.patient_response_summary || "No response yet"],
          ["Requested contact", event.requested_contact || "-"],
          ["Reported condition", event.reported_condition || "-"],
          ["Reported action", event.reported_action || "-"],
          ["Supply location", event.supply_location || "-"],
          ["Acknowledged by", event.acknowledged_by || "-"],
        ];
        for (const [label, value] of rows) {
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = value;
          details.append(dt, dd);
        }

        const mapsLink = document.getElementById("mapsLink");
        mapsLink.innerHTML = event.maps_url
          ? `<a href="${event.maps_url}" target="_blank" rel="noopener">Open patient location in Maps</a>`
          : "";

        const ackBtn = document.getElementById("ackBtn");
        const ackMessage = document.getElementById("ackMessage");
        if (event.status === "contacting") {
          ackBtn.disabled = false;
          ackMessage.textContent = "";
        } else if (event.status === "acknowledged") {
          ackBtn.disabled = true;
          ackMessage.textContent = `Acknowledged by ${event.acknowledged_by || "a caregiver"}.`;
        } else {
          ackBtn.disabled = true;
          ackMessage.textContent = "No acknowledgement needed right now.";
        }

        const timeline = document.getElementById("timeline");
        timeline.innerHTML = "";
        for (const entry of event.timeline) {
          const li = document.createElement("li");
          li.textContent = `${new Date(entry.created_at).toLocaleTimeString()} - ${entry.message}`;
          timeline.append(li);
        }
      }

      async function refresh() {
        const event = await loadEvent();
        if (event) render(event);
      }

      async function acknowledge() {
        const name = window.prompt("Your name?", "Helper") || "Helper";
        const response = await fetch(
          `/api/caregiver/events/${publicToken}/acknowledge`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ caregiver_name: name }),
          },
        );
        const data = await response.json();
        if (response.ok) {
          render(data);
        } else {
          alert(data.detail?.message || data.detail || "Could not acknowledge.");
        }
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
